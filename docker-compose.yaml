version: '3.3'
# ============================================================
# certd-x VIP 版 — 官方 docker-compose 配置 (推荐直接使用此文件)
# 
# 使用:
#   mkdir -p /data/certd && cd /data/certd
#   放本文件 (docker-compose.yaml)
#   docker compose up -d
#
# 数据保存在 ./data  (宿主机), 备份此目录即可容灾
# 打开 http://<服务器IP>:7001 → 登录 admin / 123456 (首登强制改密)
# 授权状态: 后台 → 系统设置 → 授权信息 → plus / 永久 (自动激活)
# ============================================================

services:
  certd:
    # ★ certd-x VIP 镜像 (已烧入 patched plus-core + fake-plus-server + auto-activate)
    #   tags: :latest (跟踪上游) / :stable / :v1.0.0-2026.9.14 (锁版) / :<certd_version>
    image: ghcr.io/2016xyz/certd-vip:latest
    container_name: certd
    restart: unless-stopped

    volumes:
      # ★ 数据目录 — 备份此目录即可容灾; 冒号后 /app/data 不要动
      - ./data:/app/data
      # if 走时不准, 打开下面两行挂载
      # - /etc/localtime:/etc/localtime
      # - /etc/timezone:/etc/timezone

    ports:
      # http 端口 (如改第一个, 第二个不要动)
      - "7001:7001"
      # https 端口
      - "7002:7002"

    environment:
      - TZ=Asia/Shanghai
      # ★ VIP 类型: plus (专业版) / comm (商业版)
      - CERTD_VIP_TYPE=plus
      # 忘记管理员密码时设 true 重启=重置 123456, 及时改回 false
      - certd_system_resetAdminPasswd=false
      # 监听 0.0.0.0 (容器内可访问)
      - certd_koa_hostname=0.0.0.0
      # 如果云服务器 DNS 解析失败 (getaddrinfo EAI_AGAIN), 打开下面两行:
      # - certd_flyway_dns=1
      # dns:
      #   - 223.5.5.5
      #   - 119.29.29.29
      #   - 8.8.8.8

    # 端口被占用时, 可换为 "8001:7001" (外层端口改即可)
    # 如果网络问题严重 (getaddrinfo 建议优先), 可启用 host 网络:
    #   network_mode: host
    #   ports: 需要注释
    labels:
      com.centurylinklabs.watchtower.enable: "false"
    # 如果 云DNS 报 getaddrinfo EAI_AGAIN, 加自定义dns:
    # dns:
    #   - 223.5.5.5
    #   - 119.29.29.29

    # 数据库选型 (默认 sqlite, 改其他请按下方样例; 不支持切换数据库类型)
    #  —— 使用 PostgreSQL (先手动建库): —
    #    - certd_flyway_scriptDir=./db/migration-pg
    #    - certd_typeorm_dataSource_default_type=postgres
    #    - certd_typeorm_dataSource_default_host=localhost
    #    - certd_typeorm_dataSource_default_port=5433
    #    - certd_typeorm_dataSource_default_username=postgres
    #    - certd_typeorm_dataSource_default_password=yourpasswd
    #    - certd_typeorm_dataSource_default_database=certd
    #    - certd_typeorm_dataSource_default_ssl_rejectUnauthorized=false
    # 使用 MySQL8 (charset utf8mb4, collation utf8mb4_bin):
    #    - certd_flyway_scriptDir=./db/migration-mysql
    #    - certd_typeorm_dataSource_default_type=mysql
    #    - certd_typeorm_dataSource_default_host=localhost
    #    - certd_typeorm_dataSource_default_port=3306
    #    - certd_typeorm_dataSource_default_username=root
    #    - certd_typeorm_dataSource_default_password=yourpasswd
    #    - certd_typeorm_dataSource_default_database=certd
    #    - certd_typeorm_dataSource_default_ssl_rejectUnauthorized=false

# 自动升级 (可选, 手动默认不启用)
# certd-updater:
#   image: containrrr/watchtower:latest
#   container_name: certd-updater
#   restart: unless-stopped
#   volumes:
#     - /var/run/docker.sock:/var/run/docker.sock
#   environment:
#     - WATCHTOWER_CLEANUP=true
#     - WATCHTOWER_INCLUDE_STOPPED=false
#     - WATCHTOWER_LABEL_ENABLE=true       # 只更新 certd
#     - WATCHTOWER_POLL_INTERVAL=600       # 每10分钟检测 (启动前记得调整)
#
#    ↓↓↓↓ ------------------------------------------------------------- 启用 ipv6 网络:
#networks:
#  ip6net:
#    enable_ipv6: true
#    ipam:
#      config:
#        - subnet: 2001:db8::/64
