# ============================
# certd-vip-activator 自动构建 GitHub Actions
# 跟踪上游 certd/certd releases, 拉最新版 plus-core, 自动 patch, 构建 VIP 镜像并发布到 GHCR
# ============================
name: build-vip-image

on:
  schedule:
    # 每天北京时间 08:00 自动检查新版本 (UTC 00:00)
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      certd_ref:
        description: 'certd 上游分支/tag (默认空=用 GitHub API 拿最新 release tag)'
        required: false
        default: ''

permissions:
  contents: write          # 推 patch 回 main / 生成 release tag
  packages: write          # 推 ghcr 镜像

env:
  IMAGE_NAME: certd-vip

jobs:
  build-vip:
    runs-on: ubuntu-latest
    steps:
      # ============================
      # Step 1: 拿最新 certd 版本号
      # ============================
      - name: Get latest certd release tag
        id: latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "${{ github.event.inputs.certd_ref }}" ]; then
            LATEST="${{ github.event.inputs.certd_ref }}"
          else
            LATEST=$(curl -sf https://api.github.com/repos/certd/certd/releases/latest | jq -r '.tag_name')
          fi
          echo "tag=$LATEST" >> $GITHUB_OUTPUT
          echo "certd 上游最新版本: $LATEST"

      - name: Check if already built
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 查 ghcr 是否已有该版本 tag 的 VIP 镜像, 有则跳过构建
          PKG_VERSION="${{ steps.latest.outputs.tag }}"
          PKG_VERSION="${PKG_VERSION#v}"
          EXISTS=$(curl -sf -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://ghcr.io/v2/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_NAME}/tags/list" \
            | jq -r --arg v "$PKG_VERSION" '.tags // [] | index($v) | not | not')
          echo "already_built=$EXISTS" >> $GITHUB_OUTPUT
          echo "版本 $PKG_VERSION 是否已构建: $EXISTS"

      - name: Skip if already built
        if: steps.check.outputs.already_built == 'true'
        run: echo "✋ 版本 ${{ steps.latest.outputs.tag }} 已构建过, 跳过"

      - name: Continue if new version
        if: steps.check.outputs.already_built != 'true'
        run: echo "🚀 开始构建新版本 ${{ steps.latest.outputs.tag }}"

      # ============================
      # Step 2: 检出本仓库 (patch 工具 + orchestr 文件)
      # ============================
      - name: Checkout this repo
        if: steps.check.outputs.already_built != 'true'
        uses: actions/checkout@v4
        with:
          path: activator

      - name: Setup Node.js
        if: steps.check.outputs.already_built != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # ============================
      # Step 3: 拉最新 plus-core + 自动 patch
      # ============================
      - name: Patch plus-core (latest)
        if: steps.check.outputs.already_built != 'true'
        working-directory: activator
        run: |
          set -e
          mkdir -p pluscore-temp
          cd pluscore-temp
          npm pack @certd/plus-core@latest --registry=https://registry.npmmirror.com
          TARBALL=$(ls certd-plus-core-*.tgz | head -1)
          tar xzf "$TARBALL"
          cd ../

          # 用 patch 脚本把最新 plus-core 换公钥 + 四处逻辑 patch
          node - <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const path = require('path');

          const pkg = 'pluscore-temp/package/dist/index.js';
          let src = fs.readFileSync(pkg, 'utf8');

          // 生成自签 RSA-2048 (每次构建持久化到仓库, 与 FAKE_SERVER 同 key)
          let privPem = null;
          const keyPath = 'activator/patched/selfsign_key.pem';
          if (fs.existsSync(keyPath)) {
            privPem = fs.readFileSync(keyPath, 'utf8');
            console.log('[+] 使用仓库已存的 selfsign_key.pem');
          } else {
            const { privateKey, publicKey } = crypto.generateKeyPairSync('rsa', {
              modulusLength: 2048,
              privateKeyEncoding: { type: 'pkcs8', format: 'pem' },
              publicKeyEncoding: { type: 'pkcs1', format: 'pem' },
            });
            privPem = privateKey;
            fs.writeFileSync(keyPath, privateKey);
            fs.writeFileSync('activator/patched/selfsign_pub.pem', publicKey);
            console.log('[✓] 生成新的 selfsign keypair');
          }
          const pkcs8 = fs.readFileSync(keyPath, 'utf8');
          const keyObj = crypto.createPrivateKey(pkcs8);
          const pubPem = keyObj.export({ type: 'pkcs1', format: 'pem' });
          const pubB64 = Buffer.from(pubPem).toString('base64');

          // patch 1: 换公钥
          src = src.replace(/let l="([^"]+)"/, `let l="${pubB64}"`);

          // patch 2: 禁远程 check 失败时的打回
          src = src.replace(
            'if(e.ok)m()||await this.reLocalVerify(this.licenseReq);else if(!1===e.ok){const t=e.message;return m()?(r.error("vip校验失败，退回基础版，原因："+t),this.setLicenseInfo(!1,{message:t,expireTime:e.expiresAt})):void 0}',
            'if(e.ok){m()||await this.reLocalVerify(this.licenseReq)}'
          );
          // patch 3: 禁自杀定时器
          src = src.replace(
            'return e.info("license 校验失败!!!"),function(){const e=Math.floor(1e3*Math.random()*60*60);setTimeout(()=>{console.log("11111"),process.exit(0)},e)}();',
            'return e.info("license ok");'
          );
          // patch 4: 禁远程覆盖
          src = src.replace('if(y()!=e.expiresAt||U()!=e.vipType&&g()!=e.vipType){', 'if(false){');

          // 自校验
          const m = src.match(/let l="([A-Za-z0-9+/=]+)"/);
          if (Buffer.from(m[1], 'base64').toString().slice(0, 40) !== '-----BEGIN RSA PUBLIC KEY') throw new Error('patch1 公钥替换失败');
          if (!src.includes('license ok')) throw new Error('patch3 自杀禁用失败');
          if (!src.includes('if(false){')) throw new Error('patch4 禁覆盖失败');

          // 逐 X 处校验后落盘
          fs.mkdirSync('activator/patched', { recursive: true });
          fs.writeFileSync('activator/patched/plus-core-patched.js', src);
          console.log('[✓] plus-core 已 patch, 公钥指纹:', pubB64.slice(0, 40));
          NODE

      # ============================
      # Step 4: 检出 certd 上游源码
      # ============================
      - name: Checkout certd upstream
        if: steps.check.outputs.already_built != 'true'
        uses: actions/checkout@v4
        with:
          repository: certd/certd
          ref: ${{ steps.latest.outputs.tag }}
          path: certd-src
          fetch-depth: 0
          lfs: true

      # ============================
      # Step 5: 准备 Dockerfile (基于上游 packages/ui/Dockerfile)
      # ============================
      # Step 4: 准备 Docker 构建上下文
      # ============================
      - name: Prepare build context
        if: steps.check.outputs.already_built != 'true'
        run: |
          set -e
          # 复制 certd 上游 packages/ui 作为 Docker context
          # (含 certd-client/dist, certd-server, Dockerfile 所需全部文件)
          mkdir -p build-context
          cp -r certd-src/packages/ui/. build-context/

          # 覆盖：官方 Dockerfile 中引用的 ssh2 补丁 patch 目录（如有）
          # (certd 上游 packages/ui/patch/ssh2/*.js 已随 ui 目录带入)

          # ★★ VIP 关键：把 patched plus-core 放进 build context
          cp activator/patched/plus-core-patched.js build-context/patched-plus-core.js

          # ★★ fake-plus-server 与密钥也放 build context, 让镜像入口内置
          cp activator/PoC/fake_plus_server.py  build-context/fake_plus_server.py
          cp activator/patched/selfsign_key.pem  build-context/selfsign_key.pem
          cp activator/docker/vip-deploy/entrypoint-vip.sh build-context/entrypoint-vip.sh

          # 官方 Dockerfile 用了 ./patch/ssh2/*.js COPY, 若上游没带此文件, 需 patch Dockerfile
          # (官方仓库 certd-src/packages/ui/patch/ssh2/ 应该已存在; 不存在时处理)
          if [ ! -d build-context/patch/ssh2 ]; then
            echo '[warn] 官方 Dockerfile 引用 ./patch/ssh2/*.js 但目录缺失, 已注释该行'
            sed -i.bak 's|^COPY ./patch/ssh2/|# COPY ./patch/ssh2/|' activator/docker/vip-deploy/Dockerfile.vip
          fi

      # ============================
      # Step 5: 构建并推送镜像 (GHCR)
      # ============================
      - name: Set up QEMU
        if: steps.check.outputs.already_built != 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.check.outputs.already_built != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: steps.check.outputs.already_built != 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push VIP image
        if: steps.check.outputs.already_built != 'true'
        uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          sbom: false
          context: ./build-context
          file: ./activator/docker/vip-deploy/Dockerfile.vip
          build-args: |
            CERTD_VERSION=${{ steps.latest.outputs.tag }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/certd-vip:latest
            ghcr.io/${{ github.repository_owner }}/certd-vip:${{ steps.latest.outputs.tag }}
      # 注: certd 官方无 "-stable" tag 概念, 不发布 double tag

      # ============================
      # Step 5b: 测试镜像 (启动 vip 镜像, 验证授权)
      # ============================
      - name: Smoke test the VIP image
        if: steps.check.outputs.already_built != 'true'
        run: |
          # 拉镜像并起容器测试 (跑在 amd64)
          docker run -d --name vip-test \
            -e PLUS_SERVER_BASE_URL=http://127.0.0.1:11007 \
            ghcr.io/${{ github.repository_owner }}/certd-vip:latest
          sleep 30

          # 探活 + 映射到 fake-plus-server 模式? 本镜像已内置 fake-plus-server 所以不需要
          # 测试 plus 状态
          docker exec vip-test node -e "
          import('/app/node_modules/@certd/plus-core/dist/index.js').then(m=>{
            console.log('isPlus:', m.isPlus());
            console.log('vipType:', m.getVipType());
            if (m.getVipType() === 'free') { console.error('❌ still free'); process.exit(1); }
            console.log('✅ VIP patched (pending license activate at first boot)');
          });"

          # 收尾
          docker stop vip-test || true
          docker rm vip-test || true

      # ============================
      # Step 6: 提交 updated patched 文件回 main
      # ============================
      - name: Commit patched files back
        if: steps.check.outputs.already_built != 'true'
        working-directory: activator
        run: |
          git config user.name "certd-vip-bot"
          git config user.email "noreply@users.noreply.github.com"
          git add patched/
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "[bot] patch plus-core to ${{ steps.latest.outputs.tag }} (follow upstream release)"
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: Summary
        if: steps.check.outputs.already_built != 'true'
        run: |
          echo "🎉 VIP 镜像构建完成"
          echo " ghcr.io/${{ github.repository_owner }}/certd-vip:latest"
          echo " ghcr.io/${{ github.repository_owner }}/certd-vip:${{ steps.latest.outputs.tag }}"
