version: '3.3'

# ★ 使用预构建 VIP 镜像部署（ghci Actions 自动构建, 每天跟踪上游 certd:stable）
# 镜像已内置:
#   - patched plus-core       (公钥已换, 构建时烧入)
#   - fake-plus-server        (sidecar, 监听 127.0.0.1:11007)
#   - selfsign_key.pem        (与 patched 公钥配对)
#   - entrypoint-vip.sh       (自动起 fake server → 激活 → 启 certd)
# 首次启动时 certd 自动向本地 fake server 注册并即时签发永久 license, 全程零配置
#
# 实测回显 (ghcr.io/2016xyz/certd-vip:latest, base certd/certd 1.44.4 stable):
#   docker logs certd → [INFO] default - 授权校验成功：plus，到期时间：永久
#   POST /api/sys/plus/getVipTrial → {"code":0,"data":{"duration":-1}}

services:
  certd:
    # 使用 VIP 镜像 (自动构建于 certd 最新版)
    # 替换 <owner> 为你的 GitHub 用户名小写
    image: ghcr.io/2016xyz/certd-vip:latest       # 或: ghcr.io/2016xyz/certd-vip:1.44.4-stable
    # image: ghcr.io/2016xyz/certd-vip:1.44.4      # 锁定具体版本

    container_name: certd
    restart: unless-stopped
    volumes:
      - ./data:/app/data
    ports:
      - "7001:7001"
      - "7002:7002"
    environment:
      - TZ=Asia/Shanghai
      - certd_system_resetAdminPasswd=false
      - certd_koa_hostname=0.0.0.0
      # ★ 镜像 entrypoint 已默认指向本容器内置 fake server (127.0.0.1:11007)
      # 可覆盖 VIP 类型: plus | comm
      - CERTD_VIP_TYPE=plus
      # 如要给镜像内 fake server 指向外挂密钥, 用 -v 挂载后指定:
      # - CERTD_SELF_KEY=/app/tools/selfsign_key.pem
